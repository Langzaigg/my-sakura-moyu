name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build
      shell: cmd
      env:
        VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
      run: build.bat

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: loader
        path: build/Release/
